name: Rebuild and Sign APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Install Android Build Tools
      run: |
        yes | sudo /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses
        sudo /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager "build-tools;34.0.0"

    - name: Download Apktool
      run: |
        # استخدام رابط GitHub الرسمي والأحدث لـ Apktool
        wget https://github.com/iBotPeaches/Apktool/releases/download/v2.9.3/apktool-2.9.3.jar -O apktool.jar
        chmod +x apktool.jar

    - name: Build APK with Apktool
      run: |
        java -jar apktool.jar b . -o app-unsigned-unaligned.apk

    - name: Zipalign and Sign APK
      run: |
        BUILD_TOOLS="/usr/local/lib/android/sdk/build-tools/34.0.0"
        
        # 1. محاذاة التطبيق
        $BUILD_TOOLS/zipalign -f -v 4 app-unsigned-unaligned.apk app-unsigned.apk
        
        # 2. إنشاء مفتاح توقيع تجريبي
        keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
        
        # 3. توقيع التطبيق
        $BUILD_TOOLS/apksigner sign --ks debug.keystore --ks-key-alias androiddebugkey --ks-pass pass:android --key-pass pass:android --out app-signed.apk app-unsigned.apk

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Rebuilt-APK
        path: app-signed.apk
        retention-days: 7
