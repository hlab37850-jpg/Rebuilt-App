name: Build native from-scratch rewrite

on:
  push:
    branches:
      - rewrite/from-scratch
    paths:
      - 'native-rewrite/**'
      - '.github/workflows/native-rewrite.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-rewrite-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle -p native-rewrite --no-daemon assembleDebug

      - name: Verify APK exists
        run: test -s native-rewrite/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mohaseb-soft-native-rewrite-debug
          path: native-rewrite/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
